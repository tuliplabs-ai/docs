# Hatch-managed docs toolchain — no requirements.txt; everything lives here.
#
#   hatch run sdk      # install the SDK into the env (mkdocstrings imports it)
#   hatch run serve    # mkdocs live-reload on :8000
#   hatch run build    # strict production build into site/

[project]
name = "tulip-docs"
version = "1.0.0"
description = "tulipagents.ai — documentation site for the Tulip SDK"
requires-python = ">=3.11"

[tool.hatch.envs.default]
# Prose + theme only — nothing installable here.
skip-install = true
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.hatch.envs.default.scripts]
# The API reference imports the `tulip` package, so install the SDK into
# the env first. TULIP_SDK_DIR defaults to a sibling checkout; the deploy
# workflow points it at .sdk.
sdk = "python -m pip install -e {env:TULIP_SDK_DIR:../tulip-agents}"
serve = "mkdocs serve {args}"
build = "mkdocs build --strict {args}"
# Validates every ```python block against the installed SDK -- syntax,
# symbols, and call signatures. Needs `hatch run sdk` first, same as the
# API reference does.
snippets = "python scripts/check_snippets.py {args:docs}"
# The captured output on the notebook pages, re-run against the pinned SDK.
# Rotted output is worse than none: a reader who runs it and gets something
# else cannot tell which of the two is wrong.
outputs = "python scripts/notebook_output.py {args:--check}"

# The repo ships real Python tooling — the cache-bust mkdocs hook and the
# notebook-page scaffolder — so it carries the org-wide ≥95% coverage gate
# (see [[tulip-quality-bar]]), not just prose. `hatch run test:check` enforces it.
[tool.hatch.envs.test]
# pydantic: the snippet checker's tests build a stub SDK model to exercise
# the required-field and silently-ignored-extra paths without installing
# the real SDK into this env.
dependencies = ["pytest>=8", "pytest-cov>=6.0", "pydantic>=2"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
check = "pytest --cov --cov-report=term-missing {args:tests}"

[tool.coverage.run]
source = ["hooks", "scripts"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 95
show_missing = true
