site_name: tulip agents
site_description: The safest way to build agentic AI — an open-source agentic harness, the control runtime for agents that act. The cognitive router (PRISM) picks the shape, GSAR grounds every claim, and an admission gate clears every consequential action — for agents you build here and agents you already run elsewhere.
site_url: https://tulipagents.ai/
repo_url: https://github.com/tuliplabs-ai/sdk-python
repo_name: tuliplabs-ai/sdk-python
edit_uri: ""   # docs live in their own repo; edit button disabled

docs_dir: docs
strict: true

exclude_docs: |
  internal/
  doc-gen/
  img/patterns/README.md

theme:
  name: material
  custom_dir: overrides
  logo: img/tulip-mark-pink.png
  favicon: img/tulip-mark-pink.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
  # Dark (slate) is the default (listed first). Each scheme shows the icon
  # for the OTHER mode — dark shows a sun (go light), light shows a moon.
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to dark mode
  features:
  - navigation.instant
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.top
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - search.highlight
  - search.share
  - search.suggest

# Append a content hash to local CSS/JS URLs so browsers fetch fresh assets
# the moment a file changes (no more stale-cache surprises). See hooks/.
hooks:
- hooks/cache_bust.py

extra_css:
- https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap
- stylesheets/tulip.css

extra_javascript:
- javascripts/header-home.js
- javascripts/notebook-filter.js
- javascripts/sidebar-filter.js

copyright: <span class="footer-brand"><span class="footer-brand__text">tulipagents.ai</span></span><br><span class="footer-copy">Copyright &copy; 2026 tuliplabs &middot; <a href="/legal/">Legal &amp; disclaimer</a></span>

extra:
  homepage: https://tulipagents.ai/
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/tuliplabs-ai/sdk-python
    name: tulip on GitHub
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/tulip-agents/
    name: tulip-agents on PyPI
  generator: false

markdown_extensions:
- admonition
- attr_list
- md_in_html
- def_list
- footnotes
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
# Notebook pages embed the notebooks source from the SDK repo: `.sdk` is
# where the deploy workflow checks it out, `../tulip-agents` the local
# convention (see README). check_paths makes a missing include fail the
# build instead of rendering an empty section.
- pymdownx.snippets:
    base_path: [., .sdk, ../tulip-agents]
    check_paths: true
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- tables
- toc:
    permalink: true

plugins:
- search
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          docstring_style: google
          show_source: true
          show_root_heading: true
          show_root_full_path: false
          separate_signature: true
          show_signature_annotations: true
          merge_init_into_class: true
          show_if_no_docstring: false
          inherited_members: true
          members_order: source

