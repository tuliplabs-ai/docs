<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">Grounded findings · the evidence bar is the only door</text>

  <!-- candidate -->
  <g filter="url(#sh)">
    <rect x="15" y="56" width="150" height="44" rx="10" fill="#FBF9F8" stroke="#1B1620" stroke-width="1.2"/>
    <text x="90" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1620">candidate finding</text>
  </g>
  <!-- evidence claims -->
  <text x="15" y="124" font-size="11" font-weight="700" fill="#1B1620">evidence claims · typed, weighted</text>
  <g filter="url(#sh)">
    <rect x="15" y="132" width="150" height="30" rx="7" fill="#F4A6C2"/><text x="90" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2828">tool_match · w 1.00</text>
    <rect x="15" y="168" width="150" height="30" rx="7" fill="#F4A6C2"/><text x="90" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2828">signal_match · w 0.90</text>
    <rect x="15" y="204" width="150" height="30" rx="7" fill="#F4A6C2"/><text x="90" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2828">inference · w 0.60</text>
  </g>

  <!-- ground_finding gate -->
  <g filter="url(#sh)">
    <rect x="300" y="108" width="150" height="74" rx="12" fill="#E2570E"/>
    <text x="375" y="139" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">ground_finding()</text>
    <text x="375" y="158" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.9">score ≥ GSAR</text>
    <text x="375" y="172" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.9">threshold?</text>
  </g>

  <!-- Finding -->
  <g filter="url(#sh)">
    <rect x="500" y="66" width="205" height="58" rx="10" fill="#D6336C"/>
    <text x="602" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Finding — ships</text>
    <text x="602" y="108" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">gsar_score + evidence_refs · tagged</text>
  </g>
  <!-- Abstention -->
  <g filter="url(#sh)">
    <rect x="500" y="148" width="205" height="52" rx="10" fill="#FBF9F8" stroke="#9D174D" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="602" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#9D174D">Abstention — withheld</text>
    <text x="602" y="188" text-anchor="middle" font-size="10" fill="#9D174D" opacity="0.8">below the bar · reason recorded</text>
  </g>

  <!-- arrows in -->
  <line x1="165" y1="78" x2="298" y2="120" stroke="#1B1620" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="165" y1="147" x2="296" y2="138" stroke="#1B1620" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="165" y1="183" x2="296" y2="150" stroke="#1B1620" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="165" y1="219" x2="296" y2="164" stroke="#1B1620" stroke-width="1.8" marker-end="url(#a)"/>
  <!-- arrows out -->
  <line x1="450" y1="130" x2="496" y2="100" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="160" x2="496" y2="172" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>

  <text x="20" y="285" font-size="10" font-style="italic" fill="#1B1620">a Finding has no constructor without a score — an ungrounded finding is a false positive by construction, and no path builds one</text>
</svg>
