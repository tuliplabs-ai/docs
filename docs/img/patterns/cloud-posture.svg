<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">Cloud-posture agent · gather read-only evidence, ground every finding</text>

  <!-- pipeline row -->
  <g filter="url(#sh)">
    <rect x="15" y="64" width="120" height="66" rx="11" fill="#D6336C"/>
    <text x="75" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">SOC analyst</text>
    <text x="75" y="110" text-anchor="middle" font-size="9.5" fill="#FFFFFF" opacity="0.85">create_soc_analyst()</text>
  </g>
  <g filter="url(#sh)">
    <rect x="160" y="62" width="165" height="70" rx="11" fill="#1B1620"/>
    <text x="242" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">read-only AWS</text>
    <text x="242" y="105" text-anchor="middle" font-size="9.5" fill="#FFFFFF" opacity="0.85">describe_aws · use_aws</text>
    <text x="242" y="119" text-anchor="middle" font-size="9.5" fill="#FFFFFF" opacity="0.85">Describe / List / Get only</text>
  </g>
  <g filter="url(#sh)">
    <rect x="350" y="66" width="120" height="64" rx="11" fill="#F4A6C2"/>
    <text x="410" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2828">API facts</text>
    <text x="410" y="111" text-anchor="middle" font-size="9.5" fill="#1F2828" opacity="0.8">the evidence</text>
  </g>
  <g filter="url(#sh)">
    <rect x="490" y="64" width="135" height="66" rx="11" fill="#E2570E"/>
    <text x="557" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">ground_report()</text>
    <text x="557" y="110" text-anchor="middle" font-size="9.5" fill="#FFFFFF" opacity="0.9">GSAR per finding</text>
  </g>
  <line x1="135" y1="97" x2="156" y2="97" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="325" y1="97" x2="346" y2="97" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="470" y1="97" x2="486" y2="97" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>

  <text x="110" y="150" font-size="10" font-style="italic" fill="#9D174D">two read-only controls: tool gate + read-only IAM principal — the auditor can't become the incident</text>

  <!-- split -->
  <g filter="url(#sh)">
    <rect x="400" y="190" width="210" height="46" rx="10" fill="#D6336C"/>
    <text x="505" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">SHIP — Finding</text>
    <text x="505" y="227" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">cites the exact API fact</text>
  </g>
  <g filter="url(#sh)">
    <rect x="400" y="246" width="210" height="44" rx="10" fill="#FBF9F8" stroke="#9D174D" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="505" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#9D174D">ABSTAIN</text>
    <text x="505" y="283" text-anchor="middle" font-size="10" fill="#9D174D" opacity="0.8">inference only — no call behind it</text>
  </g>
  <path d="M 557,130 L 557,168 Q 557,180 545,184 L 512,190" fill="none" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 585,130 Q 652,152 652,208 Q 652,254 620,265 L 614,267" fill="none" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>

  <text x="20" y="305" font-size="10" font-style="italic" fill="#1B1620">a finding backed by GetAccountSummary ships; an un-observed "over-privileged role" abstains — the same model proposed both</text>
</svg>
