<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">The trust chain · evidence to enforced action</text>

  <!-- Target -->
  <g filter="url(#sh)">
    <rect x="15" y="62" width="120" height="56" rx="10" fill="#FBF9F8" stroke="#1B1620" stroke-width="1.2"/>
    <text x="75" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1620">Target</text>
    <text x="75" y="105" text-anchor="middle" font-size="10" fill="#1B1620" opacity="0.7">endpoint · agent · a2a</text>
  </g>
  <!-- Job -->
  <g filter="url(#sh)">
    <rect x="170" y="62" width="125" height="56" rx="10" fill="#D6336C"/>
    <text x="232" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">red_team · assure</text>
    <text x="232" y="104" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">attack / assess the AI</text>
  </g>
  <!-- GSAR gate -->
  <g filter="url(#sh)">
    <rect x="330" y="60" width="115" height="60" rx="10" fill="#E2570E"/>
    <text x="387" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">GSAR</text>
    <text x="387" y="104" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.9">grounding threshold</text>
  </g>
  <!-- Finding -->
  <g filter="url(#sh)">
    <rect x="485" y="30" width="220" height="48" rx="10" fill="#D6336C"/>
    <text x="595" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Finding — ships</text>
    <text x="595" y="67" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">tagged ATLAS · OWASP LLM/ASI</text>
  </g>
  <!-- Abstention -->
  <g filter="url(#sh)">
    <rect x="485" y="100" width="220" height="46" rx="10" fill="#FBF9F8" stroke="#9D174D" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="595" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#9D174D">Abstention — withheld</text>
    <text x="595" y="136" text-anchor="middle" font-size="10" fill="#9D174D" opacity="0.8">no proof, so no claim</text>
  </g>
  <line x1="135" y1="90" x2="166" y2="90" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="295" y1="90" x2="326" y2="90" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="445" y1="82" x2="481" y2="58" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="445" y1="100" x2="481" y2="122" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>

  <!-- Admission gate row -->
  <g filter="url(#sh)">
    <rect x="330" y="196" width="150" height="58" rx="10" fill="#1B1620"/>
    <text x="405" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">admit() · policy chain</text>
    <text x="405" y="239" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">approve → ALLOW, else raise</text>
  </g>
  <g filter="url(#sh)">
    <rect x="520" y="198" width="185" height="54" rx="10" fill="#D6336C"/>
    <text x="612" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">action fires</text>
  </g>
  <!-- Finding down into admit -->
  <path d="M 560,78 L 560,160 Q 560,172 548,176 L 470,196" fill="none" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="225" x2="516" y2="225" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>

  <text x="20" y="285" font-size="11" font-style="italic" fill="#1B1620">no evidence → no claim · no approval → no action · every decision recorded to a hash-chained audit trail</text>
</svg>
