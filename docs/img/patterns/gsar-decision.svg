<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">GSAR · partition the claims, score, then decide three ways</text>

  <!-- synthesis -->
  <g filter="url(#sh)">
    <rect x="15" y="72" width="120" height="54" rx="10" fill="#FBF9F8" stroke="#1B1620" stroke-width="1.2"/>
    <text x="75" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1620">synthesis</text>
    <text x="75" y="113" text-anchor="middle" font-size="10" fill="#1B1620" opacity="0.7">the conclusion</text>
  </g>
  <!-- partition -->
  <g filter="url(#sh)">
    <rect x="168" y="72" width="155" height="54" rx="10" fill="#F4A6C2"/>
    <text x="245" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2828">partition claims</text>
    <text x="245" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2828">G ⊔ U ⊔ X ⊔ K</text>
  </g>
  <!-- score -->
  <g filter="url(#sh)">
    <rect x="356" y="70" width="120" height="58" rx="10" fill="#E2570E"/>
    <text x="416" y="95" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">score S</text>
    <text x="416" y="113" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.9">weighted, in [0,1]</text>
  </g>

  <!-- decisions -->
  <g filter="url(#sh)">
    <rect x="515" y="34" width="190" height="46" rx="10" fill="#D6336C"/>
    <text x="610" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">proceed — ship</text>
    <text x="610" y="71" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">S ≥ 0.80</text>
  </g>
  <g filter="url(#sh)">
    <rect x="515" y="92" width="190" height="46" rx="10" fill="#F4A6C2"/>
    <text x="610" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2828">regenerate</text>
    <text x="610" y="129" text-anchor="middle" font-size="10" fill="#1F2828" opacity="0.8">0.65 ≤ S &lt; 0.80</text>
  </g>
  <g filter="url(#sh)">
    <rect x="515" y="150" width="190" height="46" rx="10" fill="#1B1620"/>
    <text x="610" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">replan</text>
    <text x="610" y="187" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">S &lt; 0.65</text>
  </g>

  <!-- forward arrows -->
  <line x1="135" y1="99" x2="164" y2="99" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="323" y1="99" x2="352" y2="99" stroke="#1B1620" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="476" y1="92" x2="511" y2="57" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="476" y1="99" x2="511" y2="113" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="476" y1="106" x2="511" y2="170" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>

  <!-- recovery loops -->
  <path d="M 515,115 L 497,115 L 497,255 L 75,255 L 75,128" fill="none" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>
  <text x="92" y="249" font-size="10" font-style="italic" fill="#9D174D">regenerate · rewrite synthesis, no tool re-run</text>
  <path d="M 515,173 L 507,173 L 507,292 L 245,292 L 245,128" fill="none" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>
  <text x="262" y="286" font-size="10" font-style="italic" fill="#9D174D">replan · re-dispatch specialists, K_max budget</text>

  <text x="20" y="318" font-size="11" font-style="italic" fill="#1B1620">each claim is grounded, yet the conclusion can over-reach — GSAR catches the loose middle band instead of shipping it</text>
</svg>
