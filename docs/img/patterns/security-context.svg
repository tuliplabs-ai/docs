<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">SecurityContext · one handle, six domains, zero vendor names</text>

  <!-- facade -->
  <g filter="url(#sh)">
    <rect x="15" y="118" width="142" height="110" rx="12" fill="#D6336C"/>
    <text x="86" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Security</text>
    <text x="86" y="184" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Context</text>
    <text x="86" y="204" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">reason in domains</text>
  </g>

  <!-- six domain ports -->
  <g filter="url(#sh)">
    <rect x="206" y="56" width="200" height="34" rx="8" fill="#F4A6C2"/><text x="306" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">ctx.logs · SIEM search</text>
    <rect x="206" y="98" width="200" height="34" rx="8" fill="#F4A6C2"/><text x="306" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">ctx.endpoint · EDR isolate</text>
    <rect x="206" y="140" width="200" height="34" rx="8" fill="#F4A6C2"/><text x="306" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">ctx.identity · risk · disable</text>
    <rect x="206" y="182" width="200" height="34" rx="8" fill="#F4A6C2"/><text x="306" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">ctx.cloud · read-only events</text>
    <rect x="206" y="224" width="200" height="34" rx="8" fill="#F4A6C2"/><text x="306" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">ctx.threat_intel · enrich</text>
    <rect x="206" y="266" width="200" height="34" rx="8" fill="#1B1620"/><text x="306" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ctx.actions · approve · execute</text>
  </g>

  <!-- fan arrows -->
  <line x1="159" y1="160" x2="202" y2="73"  stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="159" y1="166" x2="202" y2="115" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="159" y1="173" x2="202" y2="157" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="159" y1="180" x2="202" y2="199" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="159" y1="186" x2="202" y2="241" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="159" y1="192" x2="202" y2="283" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- provider swap -->
  <text x="560" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1B1620">each port resolves to</text>
  <g filter="url(#sh)">
    <rect x="470" y="112" width="180" height="44" rx="9" fill="#FBF9F8" stroke="#1B1620" stroke-width="1.2"/>
    <text x="560" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#1B1620">offline reference</text>
    <text x="560" y="147" text-anchor="middle" font-size="10" fill="#1B1620" opacity="0.7">default · no creds</text>
  </g>
  <g filter="url(#sh)">
    <rect x="470" y="196" width="180" height="44" rx="9" fill="#1B1620"/>
    <text x="560" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">live vendor</text>
    <text x="560" y="231" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">Auth0 · VirusTotal · Splunk…</text>
  </g>
  <line x1="560" y1="160" x2="560" y2="192" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-start="url(#am)" marker-end="url(#am)"/>
  <text x="668" y="180" text-anchor="middle" font-size="10" font-style="italic" fill="#9D174D">inject</text>
  <line x1="406" y1="174" x2="466" y2="150" stroke="#1B1620" stroke-width="1.8" marker-end="url(#a)"/>

  <text x="20" y="320" font-size="11" font-style="italic" fill="#1B1620">program against domains, not SDKs · the trust spine — grounding, verify, policy, audit — applies whoever is behind the port</text>
</svg>
