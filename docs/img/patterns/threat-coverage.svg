<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
     shape-rendering="geometricPrecision">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#1B1620"/>
    </marker>
    <marker id="am" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#9D174D"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="14" font-weight="800" fill="#1B1620" letter-spacing="-0.01em">Threat scenarios · every catalogue ID → a runnable defense gist</text>

  <!-- catalogues -->
  <g filter="url(#sh)">
    <rect x="15" y="62" width="170" height="44" rx="9" fill="#F4A6C2"/><text x="100" y="81" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">OWASP LLM (2025)</text><text x="100" y="97" text-anchor="middle" font-size="10" fill="#1F2828" opacity="0.8">LLM01–LLM10</text>
    <rect x="15" y="118" width="170" height="44" rx="9" fill="#F4A6C2"/><text x="100" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">OWASP ASI (2026)</text><text x="100" y="153" text-anchor="middle" font-size="10" fill="#1F2828" opacity="0.8">ASI01–ASI10</text>
    <rect x="15" y="174" width="170" height="44" rx="9" fill="#F4A6C2"/><text x="100" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2828">MITRE ATLAS</text><text x="100" y="209" text-anchor="middle" font-size="10" fill="#1F2828" opacity="0.8">AML.Txxxx</text>
  </g>

  <!-- gist container -->
  <rect x="232" y="64" width="248" height="162" rx="12" fill="#FBF9F8" stroke="#1B1620" stroke-width="0.9" stroke-dasharray="4,3"/>
  <text x="356" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#1B1620">scenario gist · threat × agent × defense</text>
  <g filter="url(#sh)">
    <rect x="250" y="92" width="212" height="32" rx="8" fill="#1B1620"/><text x="356" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">① threat stated</text>
    <rect x="250" y="134" width="212" height="32" rx="8" fill="#FBF9F8" stroke="#1B1620" stroke-width="1.2"/><text x="356" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#1B1620">② agent hits it</text>
    <rect x="250" y="176" width="212" height="36" rx="8" fill="#D6336C"/><text x="356" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">③ defense fires</text><text x="356" y="207" text-anchor="middle" font-size="9.5" fill="#FFFFFF" opacity="0.85">primitive · pattern · both</text>
  </g>
  <line x1="356" y1="124" x2="356" y2="132" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="356" y1="166" x2="356" y2="174" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>

  <!-- catalogue -> gist -->
  <line x1="185" y1="84"  x2="228" y2="108" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="185" y1="140" x2="228" y2="148" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="185" y1="196" x2="228" y2="188" stroke="#1B1620" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- gist -> finding / abstention -->
  <g filter="url(#sh)">
    <rect x="520" y="90" width="185" height="50" rx="10" fill="#D6336C"/>
    <text x="612" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">grounded Finding</text>
    <text x="612" y="128" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.85">tagged the same ID</text>
  </g>
  <g filter="url(#sh)">
    <rect x="520" y="156" width="185" height="46" rx="10" fill="#FBF9F8" stroke="#9D174D" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="612" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#9D174D">Abstention</text>
    <text x="612" y="193" text-anchor="middle" font-size="10" fill="#9D174D" opacity="0.8">evidence below the bar</text>
  </g>
  <line x1="480" y1="120" x2="516" y2="112" stroke="#1B1620" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="160" x2="516" y2="176" stroke="#9D174D" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#am)"/>

  <text x="20" y="285" font-size="10" font-style="italic" fill="#1B1620">run_all.py runs every gist and asserts all pass — coverage stays complete: the difference between a control runtime and a security demo</text>
</svg>
