name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "SDK ref to build against (default: latest v* tag, else main)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs
        uses: actions/checkout@v4

      # The API reference imports the `tulip` package and the notebook
      # pages embed cookbook source, so we check out the SDK repo too.
      # While sdk-python is private, SDK_DEPLOY_KEY (a read-only deploy
      # key on that repo) authenticates the checkout. Once the SDK goes
      # public, delete the key + secret — the default token suffices.
      - name: Check out the SDK (for the API reference and snippets)
        uses: actions/checkout@v4
        with:
          repository: tuliplabs-ai/sdk-python
          path: .sdk
          fetch-depth: 0 # full history — needed to resolve the latest tag
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}

      # Published docs should match what `pip install tulip-agents` gives
      # people, not whatever main looks like today — pin to the newest
      # release tag. Falls back to main while no v* tag exists, and a
      # manual run can force any ref via the sdk_ref input.
      - name: Pin the SDK to the latest release
        working-directory: .sdk
        run: |
          ref="${{ inputs.sdk_ref }}"
          if [ -z "$ref" ]; then
            ref="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          fi
          if [ -n "$ref" ]; then
            echo "Building docs against SDK ref: $ref"
            git checkout -q "$ref"
          else
            echo "No v* tag yet — building against main"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain + SDK
        run: |
          python -m pip install --upgrade pip hatch
          TULIP_SDK_DIR=./.sdk hatch run sdk

      - name: Build site
        run: hatch run build

      # Serve the project landing at the root and the docs under /docs.
      # landing/ carries the root index.html + styles + CNAME; the mkdocs
      # build (site/) goes under publish/docs/.
      - name: Assemble landing (root) + docs (/docs)
        run: |
          set -eu
          rm -rf publish && mkdir -p publish/docs
          cp -r landing/. publish/
          cp -r site/. publish/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
